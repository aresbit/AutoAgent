# =============================================================================
# AWR ST 测试用例集 (正交 DAG)
# -----------------------------------------------------------------------------
# 用途: CI 直接消费本文件,按 dag_top 拓扑序调度测试用例;agent 按各 TC 内部
#       dag.nodes 顺序执行,人工步骤(human gate)等人类 resume 信号后继续。
# 来源: awr-ops skill (SKILL.md + references/st-test-sop.md + ehmi_client.py)
# 安全: 遵守 SKILL.md 规则1(质检串行) + 规则2(只走 ehmi_client.py 命令行)
# =============================================================================
# SCHEMA 速查 (YAML 字段语义):
#   variables        : 全局变量,默认值;CI 用环境变量覆盖 (AWR_DEVICE_ID 等)
#   defaults.ehmi    : ehmi_client 基础命令模板,{robot_ip}/{var} 占位
#   defaults.env     : 注入的环境变量 (workspace_id=DEVICE_ID)
#   defaults.ssh_robot: 经隧道到机器人的 SSH 基础命令
#   dag_top          : 顶层 TC 依赖图 (硬依赖);弱依赖放各 TC.preconditions
#   test_case.type   : auto | semi | manual  (决定是否需人工介入)
#   dag.nodes[].type : script | ssh | human | verify
#     - script: 跑 defaults.ehmi 拼出的命令 (command 是子命令+参数)
#     - ssh   : 在机器人板上跑 shell (command 是完整 shell, 经 defaults.ssh_robot)
#     - human : 人工步骤;人按 prompt 操作后 touch resume 文件,agent 检测后继续
#     - verify: 只做断言不下发指令 (verify 字段必填)
#   dag.nodes[].verify: 断言列表,任一失败即本节点 fail
#     {cmd: shell, expect: 字符串相等} | {grep: 模式, path: 日志目录}
#     {min_count: N, cmd: shell}  (如 mainboard 进程数 ≥6)
#   dag.nodes[].on_failure: retry(次数) | abort(停整TC) | manual(转人工)
#   dag.nodes[].report  : 追加到 report.md 的一行模板 (约束 agent 留痕)
#   dag.nodes[].resume  : 仅 human 节点;人完成后 touch 此文件,agent 检测/被通知
#   dag.nodes[].iterate : 仅 script 节点;按列表逐次执行(如逐线束轨迹生成)
#   dag.gates.pass      : 所有节点 verify 通过
# =============================================================================
version: 1
suite: awr-st
description: "AWR 机器人 ST SOP 正交测试用例集 — 每用例一个 DAG,人工步骤 human gate"

# -----------------------------------------------------------------------------
# 变量: CI 用环境变量覆盖;本地默认值仅作占位
# ⚠ "auto" = 开跑时从机器人/云端现查,不要写死站点常量。
#   写死会绑死到某一台机器(如 agent72/board188/recipe1841 在 serial=117 的机器上全错)。
#   要覆盖时填具体值即可,显式值永远优先于 auto。
# -----------------------------------------------------------------------------
variables:
  robot_ip: &robot_ip "auto"               # auto=用 config 里该机器人的实际地址
  device_id: &device_id "auto"             # auto=取活跃 workspace_id(≠ agent serial)
  agent: &agent "auto"                      # auto=从 /aw_robot_status 采集窗口解析
  map_name: &map_name "auto"               # auto=board<device_id>
  wire_type: &wire_type "THHB"               # start_awr --recipe-type 必须为 THD30|THHB|C134|WAIC|AIO
  pattern: &pattern null                   # 缺地图素材时 AIO|LZY_TH|OP
  recipe_id: &recipe_id "auto"             # auto=该板最新完成态(status=11)recipe
  start_wire_id: &start_wire_id "auto"     # auto=该 recipe 线束3起的首条 DB id; UI 可选择 job 起始线束
  wire_id_list: &wire_id_list "auto"       # auto=wireInfo/getList 查该 recipe 线束3..末尾; UI 可填 4、4 6 7、4-10 或 4 到 10
  check_type_calib: &check_type "7"        # 鱼眼手眼标定;4双目/7手眼/10内窥镜双目/13鱼眼左到内窥镜左
  qc_modes: &qc_modes [154,155,156,157]     # 质检四项,必须串行(规则1)
  calib_arm: &calib_arm "0"                # 0左 1右 2双
  calib_arm_right: &calib_arm_right "1"    # 右手 arm=1
  jump_user: &jump_user null
  jump_ip: &jump_ip null
  jump_pass: &jump_pass null
  robot_user: &robot_user "nvidia"
  robot_ip_direct: &robot_ip_direct "auto"    # auto=用 config 里该机器人的实际地址
  robot_pass: &robot_pass "nvidia"

defaults:
  env: "AWR_DEVICE_ID={device_id}"
  ehmi: "python3 scripts/ehmi/ehmi_client.py {robot_ip}"
  ssh_robot: "ssh -p 2222 {robot_user}@127.0.0.1"
  board_log: "/apollo/data/log"
  report_file: "report.md"

# -----------------------------------------------------------------------------
# 顶层 DAG: TC 间硬依赖 (拓扑序). 弱依赖写在各 TC.preconditions,不影响独立挑选.
#   独立可跑示例: TC-13(回初始姿态) / TC-14(安全恢复) / TC-05(recipe 创建) /
#                TC-00(健康前置) — 不需要整条流水线前置.
# -----------------------------------------------------------------------------
dag_top:
  - tc: TC-00
    depends_on: []
  - tc: TC-01
    depends_on: [TC-00]
  - tc: TC-02
    depends_on: [TC-01]
  - tc: TC-03
    depends_on: [TC-02]
  - tc: TC-04
    depends_on: [TC-02, TC-03]
  - tc: TC-05
    depends_on: [TC-01]
  - tc: TC-06
    depends_on: [TC-05]            # 人工打点需 recipe 已建
  - tc: TC-07
    depends_on: [TC-06]            # 黄金模板需打点完
  - tc: TC-08
    depends_on: [TC-07]            # 点位验证需黄金模板
  - tc: TC-09
    depends_on: [TC-08]            # 左手标定质检需点位验证完成
  - tc: TC-10
    depends_on: [TC-09]            # 右手标定质检需左手完成
  - tc: TC-11
    depends_on: [TC-04]            # 轨迹生成需锁精定位+recipe
  - tc: TC-12
    depends_on: [TC-11]            # 执行 job 需轨迹就绪
  - tc: TC-13
    depends_on: [TC-02]            # 回初始姿态需已绑定 (可独立,弱依赖 TC-02)
  - tc: TC-14
    depends_on: []                 # 安全恢复随时可跑

# =============================================================================
# 测试用例
# =============================================================================
test_cases:

  # ---------------------------------------------------------------------------
  - id: TC-00
    name: 环境前置与硬件健康
    type: auto
    description: "SSH 隧道建立 + HMI 可达 + 节点数 + 力传感器可达 + 无 20002 故障态"
    preconditions: []                # 无前置,第一条
    dag:
      nodes:
        - id: tunnel
          type: script
          command: "bash scripts/ssh/ssh-tunnel.sh"
          depends_on: []
          verify:
            - cmd: "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1995/"
              expect: "200"
          on_failure: retry(2)
          report: "| 0.1 | SSH 隧道 | {status} | {result} | {time} |"
        - id: mainboard_count
          type: ssh
          command: "ps aux | grep '[m]ainboard' | wc -l"
          depends_on: [tunnel]
          verify:
            - min_count: 6
              cmd: "ssh -p 2222 nvidia@127.0.0.1 \"ps aux | grep '[m]ainboard' | wc -l\""
          on_failure: abort
          report: "| 0.2 | mainboard 进程数 | {status} | count={result} (≥6) | {time} |"
        - id: force_sensor
          type: ssh
          command: "ping -c1 -W1 192.168.10.20 && ping -c1 -W1 192.168.10.21"
          depends_on: [tunnel]
          verify:
            - cmd: "ssh -p 2222 nvidia@127.0.0.1 'ping -c1 -W1 192.168.10.20 && ping -c1 -W1 192.168.10.21'"
              expect: "0"            # 退出码 0 = 都通
          on_failure: manual         # 力传感器断连需物理处理
          report: "| 0.3 | 力传感器 .20/.21 可达 | {status} | {result} | {time} |"
        - id: error_code
          type: ssh
          command: "find {board_log}/double_orin -type f -mmin -60 -name '*.log*' -print0 2>/dev/null | xargs -0 grep -haE '(^|\\x1b\\[[0-9;]*m)E[0-9]{8} .*error code: 20002' 2>/dev/null | tail -3 || true"
          depends_on: [tunnel]
          verify:
            - cmd: "find {board_log}/double_orin -type f -mmin -60 -name '*.log*' -print0 2>/dev/null | xargs -0 grep -haE '(^|\\x1b\\[[0-9;]*m)E[0-9]{8} .*error code: 20002' 2>/dev/null | wc -l"
              expect: "0"            # 无 20002 LOAD_ERROR
          on_failure: manual
          report: "| 0.4 | 无 20002 故障态 | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-01
    name: 节点启动
    type: auto
    description: "start_awr.sh 启动节点 + mainboard≥6 + HMI 200 (节点已挂时用)"
    preconditions: [TC-00]
    dag:
      nodes:
        - id: start_awr
          type: ssh
          # 必须非交互: start_awr.sh 默认 AUTO_MODE=0，会停在 y/n 提示上。
          # 人需在启动前确认线束类型（Parameters 面板选 wire_type）：1=THD30 2=THHB 3=C134 4=WAIC 5=AIO
          command: "cd /apollo && source gaea.bashrc 2>/dev/null && bash /apollo/scripts/humanoid/start_awr.sh -f --skip-coredump --region shanghai -y --auto --recipe-type {wire_type} 2>&1"
          depends_on: []
          timeout_s: 600
          on_failure: abort
          report: "| 1.1 | start_awr.sh | {status} | {result} | {time} |"
        - id: verify_mainboard
          type: ssh
          command: "ps aux | grep '[m]ainboard' | wc -l"
          depends_on: [start_awr]
          verify:
            - min_count: 6
              cmd: "ssh -p 2222 nvidia@127.0.0.1 \"ps aux | grep '[m]ainboard' | wc -l\""
          on_failure: abort
          report: "| 1.2 | mainboard≥6 | {status} | count={result} | {time} |"
        - id: verify_hmi
          type: ssh
          command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:1995/"
          depends_on: [start_awr]
          verify:
            - cmd: "ssh -p 2222 nvidia@127.0.0.1 'curl -s -o /dev/null -w \"%{http_code}\" http://localhost:1995/'"
              expect: "200"
          on_failure: abort
          report: "| 1.3 | HMI HTTP 200 | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-02
    name: 绑定机器人
    type: auto
    description: "rebind (unbind-if-bound → bind → verify),workspace_id=DEVICE_ID"
    preconditions: [TC-01]
    dag:
      nodes:
        # NOTE: agent/device_id 等参数发现由前端 Parameters 面板完成;agent 自动从
        # /aw_robot_status 采集窗口解析;若 Parameters 面板显式填了值则优先使用。
        - id: resolve_agent
          type: script
          command: "{ehmi} agents"
          depends_on: []
          report: "| 2.1 | 解析在线 agent | {status} | {result} | {time} |"
        - id: rebind
          type: script
          env: "{env}"
          command: "{ehmi} rebind {agent}"
          depends_on: [resolve_agent]
          on_failure: retry(2)
          report: "| 2.2 | rebind {agent} | {status} | {result} | {time} |"
        - id: verify_bound_board
          type: ssh
          command: "grep -rhE 'ADD TO WORKSPACE' {board_log}/ | tail -1"
          depends_on: [rebind]
          verify:
            - grep: "ADD TO WORKSPACE"
              path: "{board_log}"
          on_failure: abort
          report: "| 2.3 | 板载确认 ADD TO WORKSPACE | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-03
    name: 绑定操作地图
    type: auto
    description: "bindmap (pub/sub + provision),前置需机器人已绑定"
    preconditions: [TC-02]
    dag:
      nodes:
        # NOTE: map_name/wire_type 由前端 Parameters 面板选择;agent 根据面板填入的
        # 值执行 bindmap,若面板未填则自动推断 (map_name=board<device_id>, wire_type=从配置)。
        - id: check_bound_pre
          type: script
          command: "{ehmi} status"
          depends_on: []
          verify:
            - cmd: "{ehmi} status"
              grep: "in_workspace: True"
          on_failure: abort
          report: "| 3.1 | 绑地图前机器人已绑定 | {status} | {result} | {time} |"
        - id: bindmap
          type: script
          env: "{env}"
          command: "{ehmi} bindmap {map_name} {wire_type} {agent} {pattern}"
          depends_on: [check_bound_pre]
          verify:
            - cmd: "{ehmi} status"
          on_failure: retry(2)
          report: "| 3.2 | bindmap {map_name} {wire_type} | {status} | {result} | {time} |"
        - id: verify_map_board
          type: ssh
          command: "out=$(find {board_log}/double_orin -type f -mmin -10 -name '*.log*' -print0 2>/dev/null | xargs -0 grep -haE 'OnBindRequest|operation_map published|ReloadMap' 2>/dev/null | tail -12); echo \"$out\"; (echo \"$out\" | grep -F '{map_name}' | grep -q 'ReloadMap' || echo \"$out\" | grep -q 'operation_map published') && echo map_bind_verified"
          depends_on: [bindmap]
          verify:
            - grep: "map_bind_verified"
              path: "{board_log}"
          on_failure: abort
          report: "| 3.3 | 板载确认地图生效 (operation_map published 或 ReloadMap) | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-04
    name: 锁精定位
    type: auto
    description: "lock (mode=15/MAINTAIN),需 recipe_id+wire_id (维护页已选)"
    preconditions: [TC-02, TC-03]
    dag:
      nodes:
        - id: resolve_recipe_wire
          type: script
          command: "{ehmi} recipe-list {device_id}"
          depends_on: []
          report: "| 4.1 | 查 recipe 列表 (device={device_id}) | {status} | {result} | {time} |"
        - id: lock
          type: script
          env: "{env}"
          command: "{ehmi} lock {recipe_id} {start_wire_id}"
          depends_on: [resolve_recipe_wire]
          verify:
            - cmd: "{ehmi} status"
          on_failure: retry(2)
          report: "| 4.2 | lock recipe={recipe_id} wire={start_wire_id} | {status} | is_accepted={result} | {time} |"
        - id: verify_lock_board
          type: ssh
          command: "grep -rhE 'mode = 15' {board_log}/ | tail -1"
          depends_on: [lock]
          verify:
            - grep: "execute_task"
              path: "{board_log}"
          on_failure: abort
          report: "| 4.3 | 板载确认 mode=15 execute_task | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-05
    name: Recipe 创建
    type: auto
    description: "云端 REST 创建空白 recipe,op_map_id 按 device 自动解析 (不硬编码)"
    preconditions: [TC-01]
    dag:
      nodes:
        - id: recipe_create
          type: script
          command: "{ehmi} recipe-create auto {device_id}"
          depends_on: []
          on_failure: retry(2)
          report: "| 5.1 | recipe-create (device={device_id}) | {status} | new_id={result} | {time} |"
        - id: recipe_list_verify
          type: script
          command: "{ehmi} recipe-list {device_id}"
          depends_on: [recipe_create]
          verify:
            - cmd: "{ehmi} recipe-list {device_id}"
          on_failure: abort
          report: "| 5.2 | recipe-list 校验新建项 | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-06
    name: 人工打点 (拖手臂)
    type: manual
    description: "按 HMI 去人工打点流程: 订阅 progress/result/response,现场拖动机械臂,终态 ok 后自动 UPDATE 导入数据库"
    preconditions: [TC-05]
    dag:
      nodes:
        - id: kit_refine_run
          type: script
          command: "{ehmi} kit-refine-run {recipe_id} {device_id} 3600"
          depends_on: []
          on_failure: manual
          timeout_s: 3600
          report: "| 6.1 | HMI人工打点闭环 | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-07
    name: 黄金模板扫码
    type: manual
    description: "用 app 扫码绑 kit,生成黄金模板配置 (视觉侧数据,脚本外部提供)"
    preconditions: [TC-06]
    dag:
      nodes:
        - id: human_scan_golden
          type: human
          prompt: |
            【人工操作】用 app 扫码绑 kit,完成黄金模板配置。
            完成后在测试目录执行: touch .resume-TC-07
          resume: ".resume-TC-07"
          depends_on: []
          on_failure: manual
          timeout_s: 3600
          report: "| 7.1 | 黄金模板扫码 | ⏸️→{status} | 等待人工 resume | {time} |"
        - id: verify_golden
          type: script
          command: "{ehmi} golden-check {recipe_id}"
          depends_on: [human_scan_golden]
          on_failure: manual
          report: "| 7.2 | 黄金模板结构校验 (逐连接器) | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-08
    name: 点位验证 / 精修
    type: manual
    description: "人工点位验证 + 精修 (2D 粗点 refine,需视觉侧真实数据)"
    preconditions: [TC-07]
    dag:
      nodes:
        - id: human_point_refine
          type: human
          prompt: |
            【人工操作】在 HMI 上做点位验证 + 精修(2D 粗点 refine)。
            完成后在测试目录执行: touch .resume-TC-08
          resume: ".resume-TC-08"
          depends_on: []
          on_failure: manual
          timeout_s: 3600
          report: "| 8.1 | 点位验证/精修 | ⏸️→{status} | 等待人工 resume | {time} |"
        - id: verify_refine
          type: script
          command: "{ehmi} golden-check {recipe_id} --require-refine"
          depends_on: [human_point_refine]
          on_failure: manual
          report: "| 8.2 | 点位精修校验 (hpoints 落全) | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-09
    name: 左手标定质检 (先QC→不通过再标定→再QC)
    type: semi
    description: |
      左手 (arm=0) 四个 check_type 的质检标定循环:
        check_type=4(鱼眼双目,QC154/标定150) → 7(鱼眼手眼,QC155/标定151)
        → 10(内窥镜双目,QC156/标定152) → 13(鱼眼左目→内窥镜左目,QC157/标定153)
      流程: 人工摆位 → QC → passed? → 下一项
                                  → failed? → calibrate 重新标定 → 再QC → 下一项
      通过标准: 154/156/157 看 report 存在; 155 看 overall_std_mm < 1.5mm
    preconditions: [TC-08]
    dag:
      nodes:
        - id: human_position_qc_calib_left
          type: human
          prompt: |
            【人工操作】左手标定质检: 把手臂/标定板移到位(标定板在相机视野内)。
            完成后在测试目录执行: touch .resume-TC-09
          resume: ".resume-TC-09"
          depends_on: []
          on_failure: manual
          timeout_s: 1800
          report: "| 9.1 | 左手标定质检摆位 | ⏸️→{status} | 等待人工 resume | {time} |"
        # ---- check_type=4 鱼眼双目: QC154 → (fail?) calibrate 150 → QC154 ----
        - id: qc_154_left
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 154 0"
          depends_on: [human_position_qc_calib_left]
          on_failure: retry(1)
          report: "| 9.2 | QC 154 鱼眼双目 (左手) | {status} | passed={result} | {time} |"
        - id: calib_4_left
          type: script
          env: "{env}"
          command: "{ehmi} calibrate 4 0"
          depends_on: [qc_154_left]
          on_failure: retry(2)
          report: "| 9.3 | 标定 check_type=4 鱼眼双目 (左手) | {status} | is_accepted={result} | {time} |"
        - id: qc_154_left_retry
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 154 0"
          depends_on: [calib_4_left]
          on_failure: abort
          report: "| 9.4 | QC 154 鱼眼双目 复检 (左手) | {status} | passed={result} | {time} |"
        # ---- check_type=7 鱼眼手眼: QC155 → (fail?) calibrate 151 → QC155 ----
        - id: qc_155_left
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 155 0"
          depends_on: [qc_154_left_retry]
          on_failure: retry(1)
          report: "| 9.5 | QC 155 鱼眼手眼 (左手) | {status} | overall_std_mm < 1.5mm | {time} |"
        - id: calib_7_left
          type: script
          env: "{env}"
          command: "{ehmi} calibrate 7 0"
          depends_on: [qc_155_left]
          on_failure: retry(2)
          report: "| 9.6 | 标定 check_type=7 鱼眼手眼 (左手) | {status} | is_accepted={result} | {time} |"
        - id: qc_155_left_retry
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 155 0"
          depends_on: [calib_7_left]
          on_failure: abort
          report: "| 9.7 | QC 155 鱼眼手眼 复检 (左手) | {status} | overall_std_mm < 1.5mm | {time} |"
        # ---- check_type=10 内窥镜双目: QC156 → (fail?) calibrate 152 → QC156 ----
        - id: qc_156_left
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 156 0"
          depends_on: [qc_155_left_retry]
          on_failure: retry(1)
          report: "| 9.8 | QC 156 内窥镜双目 (左手) | {status} | passed={result} | {time} |"
        - id: calib_10_left
          type: script
          env: "{env}"
          command: "{ehmi} calibrate 10 0"
          depends_on: [qc_156_left]
          on_failure: retry(2)
          report: "| 9.9 | 标定 check_type=10 内窥镜双目 (左手) | {status} | is_accepted={result} | {time} |"
        - id: qc_156_left_retry
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 156 0"
          depends_on: [calib_10_left]
          on_failure: abort
          report: "| 9.10 | QC 156 内窥镜双目 复检 (左手) | {status} | passed={result} | {time} |"
        # ---- check_type=13 鱼眼左目→内窥镜左目: QC157 → (fail?) calibrate 153 → QC157 ----
        - id: qc_157_left
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 157 0"
          depends_on: [qc_156_left_retry]
          on_failure: retry(1)
          report: "| 9.11 | QC 157 鱼眼左目→内窥镜左目 (左手) | {status} | passed={result} | {time} |"
        - id: calib_13_left
          type: script
          env: "{env}"
          command: "{ehmi} calibrate 13 0"
          depends_on: [qc_157_left]
          on_failure: retry(2)
          report: "| 9.12 | 标定 check_type=13 鱼眼左目→内窥镜左目 (左手) | {status} | is_accepted={result} | {time} |"
        - id: qc_157_left_retry
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 157 0"
          depends_on: [calib_13_left]
          on_failure: abort
          report: "| 9.13 | QC 157 鱼眼左目→内窥镜左目 复检 (左手) | {status} | passed={result} | {time} |"
        - id: verify_calib_qc_left_board
          type: ssh
          command: "grep -rhE 'handeye_quality_summary|stereo_calibrate.*success|handeye_validate.*success' {board_log}/ | tail -8"
          depends_on: [qc_157_left_retry]
          verify:
            - grep: "success"
              path: "{board_log}"
          on_failure: manual
          report: "| 9.14 | 板载确认左手四项标定质检完成 | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-10
    name: 右手标定质检 (先QC→不通过再标定→再QC)
    type: semi
    description: |
      右手 (arm=1) 四个 check_type 的质检标定循环:
        check_type=4(鱼眼双目,QC154/标定150) → 7(鱼眼手眼,QC155/标定151)
        → 10(内窥镜双目,QC156/标定152) → 13(鱼眼左目→内窥镜左目,QC157/标定153)
      流程: 人工摆位 → QC → passed? → 下一项
                                  → failed? → calibrate 重新标定 → 再QC → 下一项
      通过标准: 154/156/157 看 report 存在; 155 看 overall_std_mm < 1.5mm
    preconditions: [TC-09]
    dag:
      nodes:
        - id: human_position_qc_calib_right
          type: human
          prompt: |
            【人工操作】右手标定质检: 把右手臂/标定板移到位(标定板在相机视野内)。
            完成后在测试目录执行: touch .resume-TC-10
          resume: ".resume-TC-10"
          depends_on: []
          on_failure: manual
          timeout_s: 1800
          report: "| 10.1 | 右手标定质检摆位 | ⏸️→{status} | 等待人工 resume | {time} |"
        # ---- check_type=4 鱼眼双目: QC154 → (fail?) calibrate 150 → QC154 ----
        - id: qc_154_right
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 154 1"
          depends_on: [human_position_qc_calib_right]
          on_failure: retry(1)
          report: "| 10.2 | QC 154 鱼眼双目 (右手) | {status} | passed={result} | {time} |"
        - id: calib_4_right
          type: script
          env: "{env}"
          command: "{ehmi} calibrate 4 1"
          depends_on: [qc_154_right]
          on_failure: retry(2)
          report: "| 10.3 | 标定 check_type=4 鱼眼双目 (右手) | {status} | is_accepted={result} | {time} |"
        - id: qc_154_right_retry
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 154 1"
          depends_on: [calib_4_right]
          on_failure: abort
          report: "| 10.4 | QC 154 鱼眼双目 复检 (右手) | {status} | passed={result} | {time} |"
        # ---- check_type=7 鱼眼手眼: QC155 → (fail?) calibrate 151 → QC155 ----
        - id: qc_155_right
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 155 1"
          depends_on: [qc_154_right_retry]
          on_failure: retry(1)
          report: "| 10.5 | QC 155 鱼眼手眼 (右手) | {status} | overall_std_mm < 1.5mm | {time} |"
        - id: calib_7_right
          type: script
          env: "{env}"
          command: "{ehmi} calibrate 7 1"
          depends_on: [qc_155_right]
          on_failure: retry(2)
          report: "| 10.6 | 标定 check_type=7 鱼眼手眼 (右手) | {status} | is_accepted={result} | {time} |"
        - id: qc_155_right_retry
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 155 1"
          depends_on: [calib_7_right]
          on_failure: abort
          report: "| 10.7 | QC 155 鱼眼手眼 复检 (右手) | {status} | overall_std_mm < 1.5mm | {time} |"
        # ---- check_type=10 内窥镜双目: QC156 → (fail?) calibrate 152 → QC156 ----
        - id: qc_156_right
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 156 1"
          depends_on: [qc_155_right_retry]
          on_failure: retry(1)
          report: "| 10.8 | QC 156 内窥镜双目 (右手) | {status} | passed={result} | {time} |"
        - id: calib_10_right
          type: script
          env: "{env}"
          command: "{ehmi} calibrate 10 1"
          depends_on: [qc_156_right]
          on_failure: retry(2)
          report: "| 10.9 | 标定 check_type=10 内窥镜双目 (右手) | {status} | is_accepted={result} | {time} |"
        - id: qc_156_right_retry
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 156 1"
          depends_on: [calib_10_right]
          on_failure: abort
          report: "| 10.10 | QC 156 内窥镜双目 复检 (右手) | {status} | passed={result} | {time} |"
        # ---- check_type=13 鱼眼左目→内窥镜左目: QC157 → (fail?) calibrate 153 → QC157 ----
        - id: qc_157_right
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 157 1"
          depends_on: [qc_156_right_retry]
          on_failure: retry(1)
          report: "| 10.11 | QC 157 鱼眼左目→内窥镜左目 (右手) | {status} | passed={result} | {time} |"
        - id: calib_13_right
          type: script
          env: "{env}"
          command: "{ehmi} calibrate 13 1"
          depends_on: [qc_157_right]
          on_failure: retry(2)
          report: "| 10.12 | 标定 check_type=13 鱼眼左目→内窥镜左目 (右手) | {status} | is_accepted={result} | {time} |"
        - id: qc_157_right_retry
          type: script
          env: "{env}"
          command: "{ehmi} quality-check 157 1"
          depends_on: [calib_13_right]
          on_failure: abort
          report: "| 10.13 | QC 157 鱼眼左目→内窥镜左目 复检 (右手) | {status} | passed={result} | {time} |"
        - id: verify_calib_qc_right_board
          type: ssh
          command: "grep -rhE 'handeye_quality_summary|stereo_calibrate.*success|handeye_validate.*success' {board_log}/ | tail -8"
          depends_on: [qc_157_right_retry]
          verify:
            - grep: "success"
              path: "{board_log}"
          on_failure: manual
          report: "| 10.14 | 板载确认右手四项标定质检完成 | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-11
    name: 轨迹生成 (逐线束串行)
    type: auto
    description: |
      ⚠️ 必须先查询 recipe 实际线束列表,wire_id 不是固定值(每个 recipe 不同)!
      查询: curl -s 'https://awr-backend-test.tars-ai.com/api/wireInfo/getList?recipe_id=<id>&page_size=0'
      支持单条/列表/区间选择(如 4、4 6 7、4-10、4 到 10)。
      逐线束 single-traj,每条必须等 3 个 _joint.npz(init_to_load/organize_and_connection/exit_poses)
      全部出现后才能继续下一条(常见陷阱: gen-traj 一次全下是异步的,会漏文件)。
    preconditions: [TC-04]
    dag:
      nodes:
        - id: query_wire_list
          type: script
          command: "curl -s 'https://awr-backend-test.tars-ai.com/api/wireInfo/getList?recipe_id={recipe_id}&page_size=0' | python3 -c \"import sys,json; d=json.load(sys.stdin); wires=d.get('data',d) if isinstance(d,dict) else d; [print(f'wire_id={w[\\\"id\\\"]} name={w.get(\\\"wire_name\\\",\\\"?\\\")}') for w in wires if isinstance(w,dict) and 'id' in w]\""
          depends_on: []
          on_failure: abort
          report: "| 11.1 | 查询 recipe={recipe_id} 线束列表 | {status} | {result} | {time} |"
        - id: traj_loop
          type: script
          env: "{env}"
          timeout_s: 240
          iterate:
            over: wire_id_list        # 逐个 wire_id 执行 (需根据 query_wire_list 结果更新)
            as: wire_id
          command: "{ehmi} single-traj {wire_id} {recipe_id}"
          depends_on: [query_wire_list]
          verify:
            - min_count: 3
              cmd: "c=0; end=$((SECONDS+240)); while [ $SECONDS -lt $end ]; do c=$(ls /apollo/data/trajectories/*_joint.npz 2>/dev/null | grep -E '{wire_name}|{wire_id}' | wc -l); [ \"$c\" -ge 3 ] && echo \"$c\" && exit 0; sleep 5; done; echo \"$c\"; exit 1"
          on_failure: abort
          report: "| 11.2 | single-traj wire={wire_id} ({wire_name}) recipe={recipe_id} | {status} | is_accepted/npz={result} | {time} |"
        - id: verify_traj_files
          type: ssh
          timeout_s: 60
          iterate:
            over: wire_id_list
            as: wire_id
          command: "ls /apollo/data/trajectories/*_joint.npz 2>/dev/null | grep -E '{wire_name}|{wire_id}' | wc -l"
          depends_on: [traj_loop]
          verify:
            - min_count: 3
              cmd: "ls /apollo/data/trajectories/*_joint.npz 2>/dev/null | grep -E '{wire_name}|{wire_id}' | wc -l"
          on_failure: abort
          report: "| 11.3 | 轨迹文件 3/3 wire={wire_id} ({wire_name}) | {status} | count={result} (≥3) | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-12
    name: 执行作业 (三步序列)
    type: auto
    description: |
      start-job = REQUEST_DATABASE(154) → START_JOB(22) → LOAD_VERIFY(26) 三步。
      只需从起始线束触发一次,机器人自动执行后续线束(常见陷阱: 逐条 start-job 会重复执行)。
      页面提供 stop-job 停止按钮,用于人工中止当前 job;不需要 recipe_id/wire_id。
      ⚠️ start_wire_id 必须使用 query_wire_list 查到的实际 wire_id,不是序号!
    preconditions: [TC-11]
    dag:
      nodes:
        - id: verify_traj_exists
          type: ssh
          command: "ls /apollo/data/trajectories/*_joint.npz | wc -l"
          depends_on: []
          verify:
            - min_count: 3
              cmd: "ssh {robot_user}@{robot_ip_direct} 'ls /apollo/data/trajectories/*_joint.npz 2>/dev/null | wc -l'"
          on_failure: abort
          report: "| 12.1 | 起始线束轨迹已存在 | {status} | count={result} (≥3) | {time} |"
        - id: start_job
          type: script
          env: "{env}"
          command: "{ehmi} start-job {recipe_id} {start_wire_id} 0"
          depends_on: [verify_traj_exists]
          verify:
            - cmd: "{ehmi} status"
          on_failure: retry(1)
          report: "| 12.2 | start-job recipe={recipe_id} wire={start_wire_id} (三步) | {status} | is_accepted={result} | {time} |"
        - id: stop_job
          type: script
          env: "{env}"
          command: "{ehmi} stop-job"
          depends_on: [start_job]
          verify:
            - cmd: "{ehmi} status"
          on_failure: manual
          report: "| 12.3 | stop-job 停止当前作业 | {status} | {result} | {time} |"
        - id: verify_job_board
          type: ssh
          command: "grep -rhE 'load verify|is_cruise_load_over|Trajectory replay' {board_log}/ | tail -5"
          depends_on: [start_job]
          verify:
            - grep: "is_cruise_load_over SUCCESS"
              path: "{board_log}"
          on_failure: manual
          report: "| 12.4 | 板载确认 job 执行 (load verify/SUCCESS/replay) | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-13
    name: 回到初始准备姿态
    type: auto
    description: "新增 ST: safe-pose 移动到初始准备姿态 (index=0, JOINT_MOVE/RECIPE)"
    preconditions: [TC-02]            # 弱依赖:已绑定即可,不必走整条流水线
    dag:
      nodes:
        - id: safe_pose_init
          type: script
          env: "{env}"
          command: "{ehmi} safe-pose {recipe_id} 0"
          depends_on: []
          on_failure: retry(2)
          report: "| 13.1 | safe-pose index=0 初始准备姿态 | {status} | 受理并检查 aw_info 规划错误: {result} | {time} |"
        - id: verify_pose_board
          type: ssh
          command: "find {board_log}/double_orin -type f -mmin -2 -name '*.log*' -print0 2>/dev/null | xargs -0 grep -haE 'mode = 110|joint_values|Trajectory planning goal was aborted|INVALID_START_STATE|WORLD_COLLISION|Failed to send robot arm trajectory plan goal' 2>/dev/null | tail -20"
          depends_on: [safe_pose_init]
          verify:
            - cmd: "find {board_log}/double_orin -type f -mmin -2 -name '*.log*' -print0 2>/dev/null | xargs -0 grep -haE 'mode = 110' 2>/dev/null | wc -l"
              min_count: 1
            - cmd: "find {board_log}/double_orin -type f -mmin -2 -name '*.log*' -print0 2>/dev/null | xargs -0 grep -haE 'Trajectory planning goal was aborted|INVALID_START_STATE|WORLD_COLLISION|Failed to send robot arm trajectory plan goal' 2>/dev/null | wc -l"
              expect: "0"
          on_failure: manual
          report: "| 13.2 | 板载确认准备姿态无规划失败 | {status} | {result} | {time} |"

  # ---------------------------------------------------------------------------
  - id: TC-14
    name: 安全恢复
    type: auto
    description: "撞机/异常后恢复: move-op(操作位) / arm-vertical(垂直) / clear-alarm / reset"
    preconditions: []                # 随时可跑,故障恢复用
    dag:
      nodes:
        - id: clear_alarm
          type: script
          env: "{env}"
          command: "{ehmi} clear-alarm"
          depends_on: []
          on_failure: retry(2)
          report: "| 14.1 | clear-alarm 清软告警 | {status} | is_accepted={result} | {time} |"
        - id: move_op
          type: script
          env: "{env}"
          command: "{ehmi} move-op"
          depends_on: [clear_alarm]
          verify:
            - cmd: "{ehmi} status"
          on_failure: retry(2)
          report: "| 14.2 | move-op 移动到操作位 (MOVE_ALL_FAR) | {status} | is_accepted={result} | {time} |"
        - id: arm_vertical
          type: script
          env: "{env}"
          command: "{ehmi} arm-vertical 0 1.0"
          depends_on: [move_op]
          verify:
            - cmd: "{ehmi} status"
          on_failure: retry(2)
          report: "| 14.3 | arm-vertical 一键垂直 | {status} | is_accepted={result} | {time} |"
        - id: reset
          type: script
          env: "{env}"
          command: "{ehmi} reset"
          depends_on: [arm_vertical]
          verify:
            - cmd: "{ehmi} status"
          on_failure: manual
          report: "| 14.4 | reset 系统复位 | {status} | is_accepted={result} | {time} |"

# =============================================================================
# 使用说明 (给 CI / agent)
# -----------------------------------------------------------------------------
# CI 调用:
#   1) 解析本 YAML,按 dag_top 做拓扑排序,得到可执行 TC 序列。
#   2) 对每个 TC,按 dag.nodes 的 depends_on 拓扑序执行节点。
#   3) 变量优先取环境变量 (AWR_DEVICE_ID / AWR_ROBOT_IP / AWR_RECIPE_ID ...),
#      否则取 variables 默认值。
#   4) {ehmi} = defaults.ehmi + robot_ip 占位;{env} = defaults.env。
#   5) type:human 节点:CI 把它当手动审批 gate,暂停并通知现场;人完成后
#      `touch <resume 文件>`,CI/agent 检测到即继续下一条 depends_on 链。
#   6) 每节点执行后立即把 report 模板渲染并 append 进 report.md (约束留痕)。
#   7) on_failure=abort → 停整 TC 并标记失败;manual → 转 REPL 等人;retry(N) → 重试 N 次。
#
# agent 执行:
#   - 严格遵守 SKILL.md 规则2:只跑 ehmi_client.py 子命令,禁止新 py 脚本直连 WS。
#   - 质检(TC-10)严格串行: 依赖链 qc_154→155→156→157 已在 YAML 结构强制。
#   - wire_id 用 DB id 不是序号 (线束3=30103..线束14=30114,按实际 recipe 重查)。
#   - workspace_id = AWR_DEVICE_ID (板号),不是 agent serial。
# =============================================================================
