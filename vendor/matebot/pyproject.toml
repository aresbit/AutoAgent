[project]
name = "matebot"
version = "0.1.1"
description = "Feishu bridge for Claude Code (interactive assistant with memory)"
requires-python = ">=3.10"
dependencies = [
    "funasr>=1.4.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "yuppie-mcp-lark>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv]
package = false
