# ── 科技日报配置 ──────────────────────────────
# 定时抓取 Hacker News 首页 → opencc LLM 中文总结 → 转 PDF → 发飞书

title: 科技日报
top_n: 30                 # 抓取首页前 N 条
data_dir: data            # 输出目录（latest.md + digests/ + pdfs/ + runs.log）

# ── 智能引擎 (opencc CLI) ─────────────────────
# 留空 = 用 opencc_backend.resolve_cli_path() 自动检测（与 MateBot 一致）
claude_cli: ""
claude_bun: bun           # bun 运行时
dangerously_skip_permissions: true   # headless 无权限弹窗

# ── 发送 ─────────────────────────────────────
send_enabled: true        # 是否发送到飞书
send_chat: ""             # 发送目标 chat_id；留空 = 复用 MateBot 的 feishu_config（P2P 会话）
